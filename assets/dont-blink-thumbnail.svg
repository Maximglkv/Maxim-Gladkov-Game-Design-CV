  <path d="M591 408h18" stroke="#f3e7df" stroke-width="3" opacity=".88"/>
  <path d="M557 360q43-58 86 0" fill="none" stroke="#ed2548" stroke-width="3" opacity=".7"/>

  <rect width="1200" height="760" fill="url(#redlight)"/>
  <path d="M0 76h1200" stroke="#f3e7df" stroke-opacity=".18"/>
  <path d="M600 0v760" stroke="#f3e7df" stroke-opacity=".08" stroke-dasharray="8 20"/>
  <rect width="1200" height="760" fill="url(#grain)" opacity=".6"/>
  <rect width="1200" height="760" fill="url(#vignette)"/>

  <g transform="translate(66 68)">
    <path d="M0 0h174M0 18h94M0 36h128" stroke="#ed2548" stroke-width="3" opacity=".8"/>
    <text x="0" y="102" fill="#f3e7df" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="5">DON'T</text>
    <text x="0" y="184" fill="#ff4460" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="5">BLINK</text>
    <text x="4" y="224" fill="#b3bec9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="5">A PSYCHOLOGICAL HORROR SIMULATION</text>
  </g>

  <g transform="translate(1014 82)" fill="none" stroke="#ff4460" stroke-opacity=".7">
    <path d="M35 0 70 35 35 70 0 35z" stroke-width="2"/>
    <path d="M35 12v46M12 35h46M19 19l32 32m0-32L19 51" stroke-width="1"/>
  </g>
</svg>
